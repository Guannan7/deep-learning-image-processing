<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深度学习图片处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 30px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fafafa;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area i {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .upload-area p {
            color: #666;
            font-size: 0.95rem;
        }

        #fileInput {
            display: none;
        }

        .task-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .task-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            border: 2px solid #667eea;
            border-radius: 50px;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .task-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .task-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .upload-btn {
            display: block;
            width: 200px;
            margin: 0 auto;
            padding: 15px 30px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .file-list {
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .file-item i {
            color: #11998e;
            margin-right: 10px;
        }

        .file-item span {
            flex: 1;
        }

        .file-item .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .results-section {
            margin-top: 40px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-header h2 {
            color: #333;
        }

        .download-all-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: #fafafa;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .result-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .result-info {
            padding: 15px;
        }

        .result-info h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .detection-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .detection-item:last-child {
            border-bottom: none;
        }

        .detection-label {
            font-weight: 600;
            color: #333;
        }

        .detection-conf {
            color: #11998e;
            font-weight: 600;
        }

        .success-badge {
            background: #11998e;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .error-badge {
            background: #ff6b6b;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        /* 分组样式 */
        .category-group {
            margin-bottom: 30px;
        }

        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .category-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .model-status {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .status-dot.available {
            background: #11998e;
            animation: pulse 2s infinite;
        }

        .status-dot.unavailable {
            background: #ff6b6b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .task-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .task-btn {
                width: 100%;
                max-width: 250px;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 深度学习图片处理工具</h1>
            <p>批量上传图片，进行目标检测或图像分类</p>
        </header>

        <div class="main-card">
            <!-- 模型状态 -->
            <div class="model-status" id="modelStatus">
                <div class="status-item">
                    <div class="status-dot unavailable" id="detectionStatus"></div>
                    <span class="status-text">目标检测模型</span>
                </div>
                <div class="status-item">
                    <div class="status-dot unavailable" id="classificationStatus"></div>
                    <span class="status-text">图像分类模型</span>
                </div>
            </div>

            <!-- 任务选择 -->
            <div class="task-selector">
                <button class="task-btn active" id="detectionBtn">🎯 目标检测</button>
                <button class="task-btn" id="classificationBtn">🏷️ 图像分类</button>
            </div>

            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <i>📁</i>
                <h3>点击或拖拽图片到此处</h3>
                <p>支持 PNG, JPG, JPEG, GIF, BMP 格式，可批量上传</p>
                <input type="file" id="fileInput" multiple accept="image/*">
            </div>

            <!-- 文件列表 -->
            <div class="file-list" id="fileList" style="display: none;"></div>

            <!-- 上传按钮 -->
            <button class="upload-btn" id="uploadBtn" disabled>
                开始处理 <span id="loadingIcon"></span>
            </button>
        </div>

        <!-- 结果展示 -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>📊 处理结果</h2>
                <div style="display: flex; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="groupByCategory" onchange="toggleGroupBy()">
                        <span style="color: #333;">🔗 按类别分组</span>
                    </label>
                    <button class="download-all-btn" id="downloadAllBtn">下载全部结果</button>
                </div>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let currentTask = 'detection';

        // 任务切换
        document.getElementById('detectionBtn').addEventListener('click', () => {
            currentTask = 'detection';
            document.getElementById('detectionBtn').classList.add('active');
            document.getElementById('classificationBtn').classList.remove('active');
        });

        document.getElementById('classificationBtn').addEventListener('click', () => {
            currentTask = 'classification';
            document.getElementById('classificationBtn').classList.add('active');
            document.getElementById('detectionBtn').classList.remove('active');
        });

        // 拖拽上传
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            addFiles(files);
        });

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            addFiles(files);
        });

        function addFiles(files) {
            const validFiles = files.filter(file => 
                file.type.startsWith('image/')
            );
            
            validFiles.forEach(file => {
                if (!selectedFiles.find(f => f.name === file.name)) {
                    selectedFiles.push(file);
                }
            });
            
            updateFileList();
            updateUploadBtn();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            
            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                return;
            }
            
            fileList.style.display = 'block';
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <i>🖼️</i>
                    <span>${file.name} (${formatSize(file.size)})</span>
                    <button class="remove-btn" onclick="removeFile(${index})">×</button>
                </div>
            `).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            updateUploadBtn();
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function updateUploadBtn() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = selectedFiles.length === 0;
        }

        // 上传处理
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const btn = document.getElementById('uploadBtn');
            const loadingIcon = document.getElementById('loadingIcon');
            
            btn.disabled = true;
            loadingIcon.innerHTML = '<span class="loading"></span>';
            
            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });
            formData.append('task_type', currentTask);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                displayResults(data.results);
            } catch (error) {
                alert('上传失败: ' + error.message);
            } finally {
                loadingIcon.innerHTML = '';
                btn.disabled = false;
            }
        });

        let currentResults = [];
        let isGroupByEnabled = false;

        function toggleGroupBy() {
            isGroupByEnabled = document.getElementById('groupByCategory').checked;
            displayResults(currentResults);
        }

        function groupByCategory(results) {
            const groups = {};
            
            results.forEach(result => {
                const detections = result.detections || [];
                
                if (detections.length > 0) {
                    // 获取最高置信度的类别
                    const topCategory = detections.reduce((max, det) => 
                        det.confidence > max.confidence ? det : max
                    , detections[0]);
                    
                    const category = topCategory.label;
                    if (!groups[category]) {
                        groups[category] = [];
                    }
                    groups[category].push(result);
                } else {
                    // 未检测到物体的图片
                    const noDetection = '未分类';
                    if (!groups[noDetection]) {
                        groups[noDetection] = [];
                    }
                    groups[noDetection].push(result);
                }
            });
            
            return groups;
        }

        function displayResults(results) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsGrid = document.getElementById('resultsGrid');
            currentResults = results;
            
            // 如果启用了分组
            if (isGroupByEnabled && currentTask === 'detection') {
                const grouped = groupByCategory(results);
                const categories = Object.keys(grouped).sort();
                
                resultsGrid.innerHTML = categories.map(category => {
                    const categoryResults = grouped[category];
                    const cardsHtml = categoryResults.map(result => createResultCard(result)).join('');
                    
                    return `
                        <div class="category-group">
                            <div class="category-header">
                                <h3>🏷️ ${formatCategoryName(category)}</h3>
                                <span class="category-count">${categoryResults.length} 张</span>
                            </div>
                            <div class="category-grid">
                                ${cardsHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                // 默认平铺展示
                resultsGrid.innerHTML = results.map(result => createResultCard(result)).join('');
            }
            
            resultsSection.classList.add('show');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function formatCategoryName(category) {
            // 将类别名转换为更友好的显示格式
            return category.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        function createResultCard(result) {
            const imageUrl = result.success ? `/outputs/${result.output_filename}?t=${Date.now()}` : '';
            const detections = result.detections || [];
            
            let detectionHtml = '';
            if (detections.length > 0) {
                detectionHtml = `
                    <div class="detection-list">
                        ${detections.map((det, idx) => `
                            <div class="detection-item">
                                <span class="detection-label">${det.label || det.label}</span>
                                <span class="detection-conf">${(det.confidence * 100).toFixed(1)}%</span>
                            </div>
                        `).slice(0, 5).join('')}
                    </div>
                `;
            }
            
            return `
                <div class="result-card">
                    <img src="${imageUrl || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect fill=%22%23ddd%22 width=%22300%22 height=%22200%22/><text x=%22150%22 y=%22100%22 text-anchor=%22middle%22 fill=%22%23999%22>图片处理失败</text></svg>'}" 
                         class="result-image" alt="${result.original_filename}">
                    <div class="result-info">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h4>${result.original_filename}</h4>
                            <span class="${result.success ? 'success-badge' : 'error-badge'}">
                                ${result.success ? '成功' : '失败'}
                            </span>
                        </div>
                        ${detectionHtml}
                    </div>
                </div>
            `;
        }

        // 下载全部结果
        document.getElementById('downloadAllBtn').addEventListener('click', async () => {
            const resultCards = document.querySelectorAll('.result-card');
            
            resultCards.forEach((card, index) => {
                const img = card.querySelector('.result-image');
                if (img && img.src.includes('/outputs/')) {
                    const link = document.createElement('a');
                    link.href = img.src;
                    link.download = `result_${index + 1}.jpg`;
                    link.click();
                    // 延迟下载，避免浏览器阻止
                    setTimeout(() => {}, 500 * index);
                }
            });
        });

        // 检查模型状态
        async function checkModelStatus() {
            try {
                const response = await fetch('/api/models');
                const data = await response.json();
                
                const detectionStatus = document.getElementById('detectionStatus');
                const classificationStatus = document.getElementById('classificationStatus');
                
                detectionStatus.className = data.detection_available ? 'status-dot available' : 'status-dot unavailable';
                classificationStatus.className = data.classification_available ? 'status-dot available' : 'status-dot unavailable';
            } catch (error) {
                console.log('无法检查模型状态');
            }
        }

        // 页面加载完成后检查模型状态
        document.addEventListener('DOMContentLoaded', () => {
            checkModelStatus();
        });
    </script>
</body>
</html>
